<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<style>
  body { width: 300px; margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: #1f2230; color: #f0f0f4; }
  .hd { padding: 14px 16px 6px; font-size: 16px; font-weight: 700; }
  .row { padding: 6px 16px; }
  label { font-size: 12px; color: #9aa; display: block; margin-bottom: 4px; }
  select, input { width: 100%; box-sizing: border-box; padding: 7px; border-radius: 6px; border: 1px solid #3a3f52; background: #2c3040; color: #fff; font-size: 13px; }
  button { padding: 9px; border: none; border-radius: 6px; background: #6c5ce7; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #5a4bd6; }
  .full { width: 100%; margin-top: 8px; }
  .btns { display: flex; gap: 8px; padding: 6px 16px; }
  .btns button { flex: 1; }
  .ghost { background: #2c3040; }
  .tip { font-size: 11px; color: #778; padding: 6px 16px 14px; line-height: 1.5; }
  #openai { display: none; }
  #cfgSummary { display: none; padding: 6px 16px; font-size: 12px; color: #8c9; }
  #cfgSummary a { color: #6c8cff; cursor: pointer; margin-left: 6px; }
  #status { font-size: 12px; padding: 0 16px; min-height: 16px; }
  #log { display:none; margin: 6px 16px; max-height: 120px; overflow:auto; background:#15171f; border-radius:6px; padding:8px; font-size:10px; color:#9aa; white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="hd">AI 翻译</div>
  <div class="row"><label>目标语言</label>
    <select id="lang">
      <option value="zh-CN">中文（简体）</option><option value="zh-TW">中文（繁体）</option>
      <option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option>
      <option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option>
    </select>
  </div>
  <div class="row"><label>翻译引擎</label>
    <select id="provider"><option value="google">谷歌免费翻译</option><option value="openai">自定义大模型（OpenAI/Azure 兼容）</option></select>
  </div>
  <div id="cfgSummary">已配置自定义模型 <span id="sumModel"></span><a id="edit">修改</a></div>
  <div id="openai">
    <div class="row"><label>API URL</label><input id="apiUrl" placeholder="https://xxx.openai.azure.com/openai/v1" /></div>
    <div class="row"><label>API Key</label><input id="apiKey" type="password" placeholder="key" /></div>
    <div class="row"><label>模型/部署名</label><input id="model" placeholder="gpt-5.4-mini" /></div>
    <div class="btns"><button id="test" class="ghost">测试</button><button id="save">保存并收起</button></div>
  </div>
  <div id="status"></div>
  <div id="log"></div>
  <div class="row"><button id="page" class="full">翻译当前页面（中英对照）</button></div>
  <div class="tip">划词：选中文字点「译」。整页：再点关闭。<a id="showLog" style="color:#6c8cff;cursor:pointer">查看日志</a></div>
  <script src="popup.js"></script>
</body>
</html>
